<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#102b2b">
  <title>Page not found | Alba Cove Trading</title>
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #183332; background: #f5f6f2; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(90vw, 620px); padding: 3rem 2rem; text-align: center; background: white; box-shadow: 0 12px 40px #102b2b12; }
    h1 { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 500; letter-spacing: -.03em; margin: 0 0 1rem; }
    p { line-height: 1.7; color: #526663; }
    a { display: inline-block; margin-top: 1rem; padding: .9rem 1.3rem; background: #173b37; color: white; text-decoration: none; }
    a:hover, a:focus-visible { background: #28554d; }
  </style>
  <script>
    (function () {
      var path = window.location.pathname.replace(/\\/+$/, "").toLowerCase() || "/";
      var routes = {
        "/trading": "/#trading",
        "/products": "/#products",
        "/investments": "/#investments",
        "/solutions": "/#solutions",
        "/network": "/#network",
        "/company": "/#company",
        "/about": "/#company",
        "/contact": "/#contact"
      };
      if (routes[path]) window.location.replace(routes[path] + window.location.search);
    }());
  </script>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>The page may have moved as our website has been updated. Explore Alba Cove Trading’s international commodities and commercial services from the homepage.</p>
    <a href="/">Visit the homepage</a>
  </main>
</body>
</html>
